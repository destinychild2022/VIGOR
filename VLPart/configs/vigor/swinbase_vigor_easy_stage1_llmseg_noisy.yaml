_BASE_: "swinbase_vigor_easy_stage1.yaml"

DATASETS:
  TRAIN: ("vigor_easy_train_llmseg_noisy",)
  TEST: ()

SOLVER:
  IMS_PER_BATCH: 16

DATALOADER:
  SAMPLER_TRAIN: "MultiDatasetSampler"
  DATASET_RATIO: [1]
  USE_DIFF_BS_SIZE: True
  DATASET_BS: [16]
  USE_RFS: [False]
  DATASET_MIN_SIZES: [[640, 800]]
  DATASET_MAX_SIZES: [1333]
  FILTER_EMPTY_ANNOTATIONS: False
  MULTI_DATASET_GROUPING: True
  DATASET_ANN: ["part"]
  STRONG_AUG_ON_PARSED: False
  NUM_WORKERS: 8

VIGOR_NOISY:
  ENABLED: True
  NOISY_RATIO: 0.5
  TOPK_MASKS_DIR: "/opt/data/private/LLMSeg/vis_output_object_topk_trainset/topk_masks"
  TOPK_RANK: 1
  DIFFICULTY: "easy"
  INSTRUCTION_INDEX: 0
  OBJECT_IOU_THRESHOLD: 0.5
  AFF_COVERAGE_THRESHOLD: 0.7
  RANDOM_SEED: 42

OUTPUT_DIR: "output/VLPart/vigor_swinbase_easy_stage1_llmseg_noisy_ratio50"
